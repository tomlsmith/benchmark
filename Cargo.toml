[workspace]
members = ["crates/benchmark", "crates/benchmark-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["Nirvana-Jie <1357711537@qq.com>"]
repository = "https://github.com/tomlsmith/benchmark"

[workspace.dependencies]
clap = { version = "4.5.48", features = ["derive"] }
command-group = "5.0.1"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support", "csv_output", "html_reports"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
taplo = { version = "=0.14.0", default-features = false }
tempfile = "3.23.0"
thiserror = "2.0.17"
toml = { version = "=1.1.4", default-features = true }
toml_edit = { version = "=0.25.13", default-features = true }
tomlsmith = "=0.3.1"
tomlsmith-benchmark = { path = "crates/benchmark" }
wait-timeout = "0.2.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.bench]
opt-level = 3
debug = false
lto = false
codegen-units = 16
incremental = false
