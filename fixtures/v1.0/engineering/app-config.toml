# Deterministic application-config-shaped corpus generated by the TomlSmith benchmark
# generator. It mirrors a comment-dense static-site configuration — top-level scalars,
# a nested params tree, menus, languages and markup policies — without copying any
# external bytes.

# Site identity.
baseURL = "https://benchmark.example.org/"
title = "TomlSmith 基准示例站点 🚀"
languageCode = "en-us"
defaultContentLanguage = "en"
theme = "engineering-benchmark"  
copyright = "© 2026 TomlSmith Benchmark contributors"
# Build metadata is fixed so the corpus stays deterministic.
buildDate=2026-08-29T12:00:00+08:00
lastmod = 2026-08-29
paginate = 24
summaryLength = 70
timeout  =  45.5
enableRobotsTXT = true
enableGitInfo = false

# Root of the nested parameter tree.
[params]
description = """
TomlSmith Benchmark 的确定性示例配置。
The description spans multiple lines and mixes English, 中文 and emoji 😀
so multi-line basic strings stay covered.
"""
mainSections=["posts", "docs", "releases"]
# Dotted keys extend sibling tables without opening new sections.
logo.light = "/images/logo-light.svg"
logo.dark = "/images/logo-dark.svg"
search.enabled = true
search.provider = "flexsearch"  
search.maxResults = 25

[params.author]
name = "TomlSmith Benchmark"
email="corpus@example.org"
bio  =  "Deterministic fixtures only — 确定性生成"

[params.templates]
release_notes = '''
Literal template: {{ .Title }} — {{ .Date }}
Windows path C:\hugo\templates stays literal here.
'''

