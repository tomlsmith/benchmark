<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">TomlSmith benchmark check results</title>
  <desc id="desc">Bar chart of cold CLI check median latency (logarithmic axis) with peak RSS for separate synthetic TOML 1.0 and TOML 1.1 documents.</desc>
  <rect width="1200" height="610" fill="#f5f7fa"/>
  <text x="30" y="46" fill="#17324d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">Check</text>
  <text x="30" y="76" fill="#60758a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">Cold CLI · median latency on a logarithmic axis · lower is better</text>
  <text x="1170" y="76" fill="#60758a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" text-anchor="end">bar top: median ms · below name: Peak RSS</text>

